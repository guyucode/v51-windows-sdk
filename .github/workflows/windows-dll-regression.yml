name: Windows DLL numerical regression
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Draft or published SDK release tag
        required: true
        default: v0.3.0-windows-preview
permissions:
  contents: read
jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x64
          - runner: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          architecture: ${{ matrix.arch }}
      - name: Download binary candidate
        shell: pwsh
        env:
          SDK_TAG: ${{ inputs.release_tag }}
        run: |
          if ($env:SDK_TAG -notmatch '^v[0-9.]+-windows-preview$') { throw 'Invalid candidate identifier' }
          New-Item -ItemType Directory incoming | Out-Null
          $root = "https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/$env:GITHUB_SHA/validation-candidates/$env:SDK_TAG"
          Invoke-WebRequest "$root/candidate.zip" -OutFile incoming/candidate.zip
          Invoke-WebRequest "$root/candidate.zip.sha256" -OutFile incoming/candidate.zip.sha256
          $zip = Get-ChildItem incoming/*.zip | Select-Object -First 1
          $sum = (Get-Content ($zip.FullName + '.sha256')).Split(' ')[0]
          if ((Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLower() -ne $sum) { throw 'SDK checksum mismatch' }
          Expand-Archive $zip.FullName sdk
      - name: Isolate Direct3D LP numerical phase
        continue-on-error: true
        env:
          V51_LP_TRACE: "1"
          V51_LP_SYNC_TRACE: "1"
        shell: pwsh
        run: |
          Set-Location sdk
          python -u -X faulthandler -c "from v51 import LPBatch; m=dict(c=[1.,2.],lower=[0.,0.],upper=[4.,4.],rhs=[1.],row=[0,0],col=[0,1],value=[1.,1.]); s=LPBatch(m,capacity=1); print(s.solve([m],seconds=2.)); s.close()"
          exit $LASTEXITCODE
      - name: Native Windows ABI, certificates and Direct3D WARP
        env:
          V51_LP_TRACE: "1"
        shell: pwsh
        run: |
          Set-Location sdk
          python -c "import sys,sysconfig; print(sys.version,sysconfig.get_platform())"
          python -u -X faulthandler test_windows.py --warp-lp
          exit $LASTEXITCODE
      - name: Save verification report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-${{ matrix.arch }}-numerical-report
          path: |
            sdk/windows_check_result.json
            sdk/v51_lp_shader*.cso
          if-no-files-found: warn
